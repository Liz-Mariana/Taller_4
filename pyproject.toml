[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lista4"
version = "0.1.0"
description = "Utilidades para la cuarta lista de ejercicios de Introducción al Machine Learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]